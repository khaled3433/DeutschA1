name: Deutsch A1 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf DeutschA1Build

          mkdir -p DeutschA1Build/app/src/main/java/com/example/deutscha1
          mkdir -p DeutschA1Build/app/src/main/res/values

          cat > DeutschA1Build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DeutschA1"
          include(":app")
          EOF

          cat > DeutschA1Build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > DeutschA1Build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > DeutschA1Build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.deutscha1'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.deutscha1'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > DeutschA1Build/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Deutsch A1</string>
          </resources>
          EOF

          cat > DeutschA1Build/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > DeutschA1Build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create application
        shell: bash
        run: |
          set -e

          cat > DeutschA1Build/app/src/main/java/com/example/deutscha1/MainActivity.java <<'EOF'
          package com.example.deutscha1;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.speech.tts.TextToSpeech;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.Switch;
          import android.widget.TextView;
          import android.content.SharedPreferences;

          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;

          public class MainActivity extends Activity {

              private TextToSpeech tts;
              private Handler handler = new Handler();

              private int intervalSeconds = 5;
              private boolean autoRepeat = false;
              private int currentIndex = 0;

              private SharedPreferences prefs;
              private Set<String> favorites = new HashSet<>();

              private final List<Word> words = new ArrayList<>();

              private static class Word {
                  String german;
                  String arabic;
                  String category;

                  Word(String german, String arabic, String category) {
                      this.german = german;
                      this.arabic = arabic;
                      this.category = category;
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  prefs = getSharedPreferences(
                          "deutsch_a1",
                          MODE_PRIVATE
                  );

                  favorites = new HashSet<>(
                          prefs.getStringSet(
                                  "favorites",
                                  new HashSet<>()
                          )
                  );

                  createWords();

                  tts = new TextToSpeech(
                          this,
                          status -> {
                              if (status == TextToSpeech.SUCCESS) {
                                  tts.setLanguage(Locale.GERMAN);
                                  tts.setSpeechRate(0.85f);
                              }
                          }
                  );

                  buildInterface();
              }

              private void createWords() {
                  add("Hallo", "مرحبًا", "التحيات");
                  add("Guten Morgen", "صباح الخير", "التحيات");
                  add("Guten Tag", "نهارك سعيد", "التحيات");
                  add("Guten Abend", "مساء الخير", "التحيات");
                  add("Tschüss", "وداعًا", "التحيات");

                  add("Bitte", "من فضلك / عفوًا", "العبارات");
                  add("Danke", "شكرًا", "العبارات");
                  add("Ja", "نعم", "العبارات");
                  add("Nein", "لا", "العبارات");
                  add("Entschuldigung", "عذرًا", "العبارات");

                  add("Ich", "أنا", "الضمائر");
                  add("Du", "أنت", "الضمائر");
                  add("Er", "هو", "الضمائر");
                  add("Sie", "هي / حضرتك / هم", "الضمائر");
                  add("Wir", "نحن", "الضمائر");
                  add("Ihr", "أنتم", "الضمائر");

                  add("sein", "يكون", "الأفعال");
                  add("haben", "يملك / لديه", "الأفعال");
                  add("machen", "يفعل / يصنع", "الأفعال");
                  add("gehen", "يذهب", "الأفعال");
                  add("kommen", "يأتي", "الأفعال");
                  add("wohnen", "يسكن", "الأفعال");
                  add("lernen", "يتعلم", "الأفعال");
                  add("sprechen", "يتحدث", "الأفعال");
                  add("essen", "يأكل", "الأفعال");
                  add("trinken", "يشرب", "الأفعال");

                  add("das Haus", "البيت", "المنزل");
                  add("die Wohnung", "الشقة", "المنزل");
                  add("das Zimmer", "الغرفة", "المنزل");
                  add("die Küche", "المطبخ", "المنزل");

                  add("die Schule", "المدرسة", "الدراسة");
                  add("der Lehrer", "المعلم", "الدراسة");
                  add("die Lehrerin", "المعلمة", "الدراسة");
                  add("das Buch", "الكتاب", "الدراسة");
                  add("der Stift", "القلم", "الدراسة");

                  add("die Arbeit", "العمل", "العمل");
                  add("der Beruf", "المهنة", "العمل");

                  add("der Freund", "الصديق", "الأشخاص");
                  add("die Freundin", "الصديقة", "الأشخاص");
                  add("die Familie", "العائلة", "الأشخاص");
                  add("die Mutter", "الأم", "الأشخاص");
                  add("der Vater", "الأب", "الأشخاص");
                  add("das Kind", "الطفل", "الأشخاص");

                  add("heute", "اليوم", "الوقت");
                  add("morgen", "غدًا", "الوقت");
                  add("gestern", "أمس", "الوقت");
                  add("jetzt", "الآن", "الوقت");
                  add("später", "لاحقًا", "الوقت");

                  add("eins", "واحد", "الأرقام");
                  add("zwei", "اثنان", "الأرقام");
                  add("drei", "ثلاثة", "الأرقام");
                  add("vier", "أربعة", "الأرقام");
                  add("fünf", "خمسة", "الأرقام");
                  add("sechs", "ستة", "الأرقام");
                  add("sieben", "سبعة", "الأرقام");
                  add("acht", "ثمانية", "الأرقام");
                  add("neun", "تسعة", "الأرقام");
                  add("zehn", "عشرة", "الأرقام");

                  add("gut", "جيد", "الصفات");
                  add("schlecht", "سيئ", "الصفات");
                  add("groß", "كبير", "الصفات");
                  add("klein", "صغير", "الصفات");
                  add("neu", "جديد", "الصفات");
                  add("alt", "قديم / كبير في السن", "الصفات");
                  add("schnell", "سريع", "الصفات");
                  add("langsam", "بطيء", "الصفات");
                  add("warm", "دافئ", "الصفات");
                  add("kalt", "بارد", "الصفات");

                  add("Wasser", "ماء", "الطعام والشراب");
                  add("Brot", "خبز", "الطعام والشراب");
                  add("Milch", "حليب", "الطعام والشراب");
                  add("Kaffee", "قهوة", "الطعام والشراب");
                  add("Tee", "شاي", "الطعام والشراب");
                  add("Apfel", "تفاحة", "الطعام والشراب");
                  add("Banane", "موزة", "الطعام والشراب");

                  add("Restaurant", "مطعم", "الأماكن");
                  add("Supermarkt", "سوبرماركت", "الأماكن");
                  add("Bahnhof", "محطة قطار", "الأماكن");
                  add("Straße", "شارع", "الأماكن");
                  add("Stadt", "مدينة", "الأماكن");

                  add("links", "يسار", "الاتجاهات");
                  add("rechts", "يمين", "الاتجاهات");
                  add("geradeaus", "إلى الأمام", "الاتجاهات");

                  add("wo", "أين", "كلمات السؤال");
                  add("wer", "من", "كلمات السؤال");
                  add("was", "ماذا", "كلمات السؤال");
                  add("wann", "متى", "كلمات السؤال");
                  add("warum", "لماذا", "كلمات السؤال");
                  add("wie", "كيف", "كلمات السؤال");
                  add("wie viel", "كم", "كلمات السؤال");
              }

              private void add(
                      String german,
                      String arabic,
                      String category
              ) {
                  for (Word w : words) {
                      if (w.german.equals(german)) {
                          return;
                      }
                  }

                  words.add(
                          new Word(german, arabic, category)
                  );
              }

              private void buildInterface() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.WHITE);

                  TextView title = new TextView(this);
                  title.setText("Deutsch A1 🇩🇪");
                  title.setTextSize(25);
                  title.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(10, 25, 10, 25);

                  root.addView(title);

                  LinearLayout nav = new LinearLayout(this);
                  nav.setOrientation(
                          LinearLayout.HORIZONTAL
                  );

                  Button wordsButton =
                          button("📚 الكلمات");

                  Button favoritesButton =
                          button("⭐ المراجعة");

                  Button settingsButton =
                          button("⚙️ الإعدادات");

                  nav.addView(
                          wordsButton,
                          weightParams()
                  );

                  nav.addView(
                          favoritesButton,
                          weightParams()
                  );

                  nav.addView(
                          settingsButton,
                          weightParams()
                  );

                  root.addView(nav);

                  ScrollView scroll =
                          new ScrollView(this);

                  LinearLayout content =
                          new LinearLayout(this);

                  content.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  content.setPadding(
                          15,
                          15,
                          15,
                          30
                  );

                  scroll.addView(content);

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  showWords(content);

                  wordsButton.setOnClickListener(
                          v -> showWords(content)
                  );

                  favoritesButton.setOnClickListener(
                          v -> showFavorites(content)
                  );

                  settingsButton.setOnClickListener(
                          v -> showSettings(content)
                  );

                  setContentView(root);
              }

              private void showWords(
                      LinearLayout content
              ) {
                  content.removeAllViews();

                  TextView heading =
                          new TextView(this);

                  heading.setText(
                          "كلمات Deutsch A1"
                  );

                  heading.setTextSize(21);
                  heading.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  content.addView(heading);

                  for (int i = 0; i < words.size(); i++) {
                      addWordCard(
                              content,
                              words.get(i),
                              i
                      );
                  }
              }

              private void showFavorites(
                      LinearLayout content
              ) {
                  content.removeAllViews();

                  TextView heading =
                          new TextView(this);

                  heading.setText(
                          "⭐ الكلمات المحفوظة"
                  );

                  heading.setTextSize(21);

                  content.addView(heading);

                  boolean found = false;

                  for (int i = 0; i < words.size(); i++) {
                      Word word = words.get(i);

                      if (favorites.contains(word.german)) {
                          found = true;

                          addWordCard(
                                  content,
                                  word,
                                  i
                          );
                      }
                  }

                  if (!found) {
                      TextView empty =
                              new TextView(this);

                      empty.setText(
                              "ما في كلمات محفوظة حاليًا ⭐"
                      );

                      empty.setTextSize(18);
                      empty.setGravity(Gravity.CENTER);
                      empty.setPadding(
                              10,
                              50,
                              10,
                              50
                      );

                      content.addView(empty);
                  }
              }

              private void addWordCard(
                      LinearLayout content,
                      Word word,
                      int index
              ) {
                  LinearLayout card =
                          new LinearLayout(this);

                  card.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  card.setPadding(
                          20,
                          18,
                          20,
                          18
                  );

                  TextView german =
                          new TextView(this);

                  german.setText(word.german);
                  german.setTextSize(23);
                  german.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  TextView arabic =
                          new TextView(this);

                  arabic.setText(word.arabic);
                  arabic.setTextSize(18);

                  TextView category =
                          new TextView(this);

                  category.setText(
                          word.category
                  );

                  category.setTextSize(14);

                  LinearLayout buttons =
                          new LinearLayout(this);

                  Button speak =
                          button("🔊 نطق");

                  Button favorite =
                          button(
                                  favorites.contains(
                                          word.german
                                  )
                                  ? "⭐ محفوظ"
                                  : "☆ حفظ"
                          );

                  buttons.addView(
                          speak,
                          weightParams()
                  );

                  buttons.addView(
                          favorite,
                          weightParams()
                  );

                  card.addView(german);
                  card.addView(arabic);
                  card.addView(category);
                  card.addView(buttons);

                  content.addView(card);

                  speak.setOnClickListener(v -> {
                      currentIndex = index;
                      speak(word.german);
                  });

                  favorite.setOnClickListener(v -> {
                      if (favorites.contains(
                              word.german
                      )) {
                          favorites.remove(
                                  word.german
                          );
                      } else {
                          favorites.add(
                                  word.german
                          );
                      }

                      prefs.edit()
                              .putStringSet(
                                      "favorites",
                                      favorites
                              )
                              .apply();

                      favorite.setText(
                              favorites.contains(
                                      word.german
                              )
                              ? "⭐ محفوظ"
                              : "☆ حفظ"
                      );
                  });
              }

              private void showSettings(
                      LinearLayout content
              ) {
                  content.removeAllViews();

                  TextView title =
                          new TextView(this);

                  title.setText(
                          "⚙️ الإعدادات"
                  );

                  title.setTextSize(22);

                  title.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  content.addView(title);

                  TextView repeatTitle =
                          new TextView(this);

                  repeatTitle.setText(
                          "النطق التلقائي"
                  );

                  repeatTitle.setTextSize(18);

                  content.addView(
                          repeatTitle
                  );

                  Switch repeat =
                          new Switch(this);

                  repeat.setText(
                          "تشغيل التكرار التلقائي"
                  );

                  repeat.setChecked(
                          autoRepeat
                  );

                  content.addView(repeat);

                  repeat.setOnCheckedChangeListener(
                          (button, checked) -> {
                              autoRepeat = checked;

                              handler.removeCallbacksAndMessages(
                                      null
                              );

                              if (autoRepeat) {
                                  scheduleRepeat();
                              }
                          }
                  );

                  TextView interval =
                          new TextView(this);

                  interval.setText(
                          "الفاصل: "
                                  + intervalSeconds
                                  + " ثواني"
                  );

                  interval.setTextSize(18);

                  content.addView(interval);

                  SeekBar seek =
                          new SeekBar(this);

                  seek.setMax(29);
                  seek.setProgress(
                          intervalSeconds - 1
                  );

                  content.addView(seek);

                  seek.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              @Override
                              public void onProgressChanged(
                                      SeekBar bar,
                                      int value,
                                      boolean fromUser
                              ) {
                                  intervalSeconds =
                                          value + 1;

                                  interval.setText(
                                          "الفاصل: "
                                                  + intervalSeconds
                                                  + " ثواني"
                                  );
                              }

                              @Override
                              public void onStartTrackingTouch(
                                      SeekBar bar
                              ) {}

                              @Override
                              public void onStopTrackingTouch(
                                      SeekBar bar
                              ) {
                                  if (autoRepeat) {
                                      handler.removeCallbacksAndMessages(
                                              null
                                      );

                                      scheduleRepeat();
                                  }
                              }
                          }
                  );
              }

              private void scheduleRepeat() {
                  handler.postDelayed(
                          () -> {
                              if (!autoRepeat) {
                                  return;
                              }

                              if (words.isEmpty()) {
                                  return;
                              }

                              Word word =
                                      words.get(
                                              currentIndex
                                      );

                              speak(word.german);

                              currentIndex++;

                              if (currentIndex >= words.size()) {
                                  currentIndex = 0;
                              }

                              scheduleRepeat();

                          },
                          intervalSeconds * 1000L
                  );
              }

              private void speak(String text) {
                  if (tts == null) {
                      return;
                  }

                  tts.speak(
                          text,
                          TextToSpeech.QUEUE_FLUSH,
                          null,
                          "deutsch_" + System.currentTimeMillis()
                  );
              }

              private Button button(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  return b;
              }

              private LinearLayout.LayoutParams weightParams() {
                  return new LinearLayout.LayoutParams(
                          0,
                          -2,
                          1
                  );
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);

                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd DeutschA1Build

          gradle clean assembleDebug --no-daemon --stacktrace

          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DeutschA1-APK
          path: DeutschA1Build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
