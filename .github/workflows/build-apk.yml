name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*DeutschA1*.zip' -print -quit)"
          echo "ZIP_FILE=$ZIP_FILE"
          test -n "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Fix Java 8 to Java 17
        run: |
          sed -i 's/VERSION_1_8/VERSION_17/g' extracted/DeutschA1/app/build.gradle.kts

      - name: Build APK
        run: gradle -p extracted/DeutschA1 :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeutschA1-debug-apk
          path: extracted/DeutschA1/app/build/outputs/apk/debug/app-debug.apk
